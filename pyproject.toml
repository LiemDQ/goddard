[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "goddard"
authors = [
    {name = "Liem Dam-Quang", email="dq@liem.ca"}
]
dynamic = ["version"]
description = "Reactive flow simulation toolkit"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]
license = { file = "LICENSE" }
keywords = [
    "rocket propulsion",
    "combustion",
    "chemical equilibrium",
    "nozzle flow",
    "method of characteristics",
    "shock waves",
    "detonation",
    "compressible flow",
    "thermodynamics",
    "cantera",
    "CEA",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Documentation = "https://liemdq.github.io/goddard/"
Repository = "https://github.com/LiemDQ/goddard"
Issues = "https://github.com/LiemDQ/goddard/issues"

[project.optional-dependencies]
# goddard.plotting imports matplotlib when a plot is drawn.
plot = ["matplotlib"]
test = ["pytest"]
dev = ["pytest"]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
# The VERSION argument of project(), the single source of the version number.
metadata.version.regex = 'project\s*\([^)]*?\bVERSION\s+(?P<value>[0-9]+(?:\.[0-9]+)*)'
cmake.build-type = "Release"
# Persistent build directory so repeated editable installs (e.g. the test-python tasks) rebuild
# incrementally instead of configuring and compiling from scratch in a temporary directory.
build-dir = "build-python/{wheel_tag}"
wheel.packages = ["python/goddard"]
# The sdist is the working tree minus .gitignore'd files, so local tool and shell files must be
# excluded explicitly. Patterns use gitignore syntax relative to the project root. Wheels take the
# package sources through the same exclusion: the /python/goddard/_core* entries drop dev-workflow
# copies of the extension and its stub, which CMake installs from the build instead. (wheel.exclude
# cannot do this, because it also matches the installed files at goddard/_core*.) Directories are
# listed without a trailing slash so that the file walk skips them entirely.
sdist.exclude = [
    "/python/goddard/_core*.so",
    "/python/goddard/_core.pyi",
    "/.claude",
    "/CLAUDE.md",
    "/debug_probes",
    "/instructions",
    "/site",
    "/build*",
    "/examples/basic_MoC.ipynb",
    "/.bash_profile",
    "/.bashrc",
    "/.profile",
    "/.zprofile",
    "/.zshrc",
    "/.gitconfig",
    "/.gitmodules",
    "/.ripgreprc",
    "/.mcp.json",
    "/.idea",
    "/.vscode",
    "/.cache",
    "/.pytest_cache",
    "/.pixi",
]
# Package builds must not fail on compiler warnings introduced by a newer toolchain; the C++ CI job
# builds with warnings as errors instead. They also skip the C++ test suite, and do not compile the
# source tree's data/ path into the library (see DATA_DIR in CMakeLists.txt).
cmake.args = [
    "-Dgoddard_BUILD_PYTHON=ON",
    "-Dgoddard_DEVELOPMENT_BUILD=OFF",
    "-DBUILD_TESTING=OFF",
    "-Dgoddard_ENABLE_SANITIZER_ADDRESS=OFF",
    "-Dgoddard_ENABLE_SANITIZER_UNDEFINED=OFF",
    "-Dgoddard_WARNINGS_AS_ERRORS=OFF",
]
