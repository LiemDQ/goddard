[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "goddard"
version = "0.1.0"
description = "Reactive flow simulation toolkit"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/goddard"]
cmake.args = [
    "-Dgoddard_BUILD_PYTHON=ON",
    "-Dgoddard_ENABLE_SANITIZER_ADDRESS=OFF",
    "-Dgoddard_ENABLE_SANITIZER_UNDEFINED=OFF",
]
