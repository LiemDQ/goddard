name: Release

# Pushing a tag vX.Y.Z builds the sdist and the conda package, publishes the sdist to PyPI and
# creates a GitHub release with the sdist attached. conda-forge packages are built by the
# goddard-feedstock, not here; the conda build only checks that the release builds and passes the
# recipe tests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist & conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag against the project version
        # project(VERSION) in CMakeLists.txt is the single source of the version; the conda recipe
        # repeats it as a context variable.
        run: |
          cmake_version=$(python3 -c "import re; print(re.search(r'project\s*\([^)]*?\bVERSION\s+([0-9]+(?:\.[0-9]+)*)', open('CMakeLists.txt').read()).group(1))")
          recipe_version=$(python3 -c "import re; print(re.search(r'^\s*version:\s*\"([^\"]+)\"', open('recipe/recipe.yaml').read(), re.M).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag ${tag_version}, CMakeLists.txt ${cmake_version}, recipe ${recipe_version}"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the CMakeLists.txt version ${cmake_version}."
            exit 1
          fi
          if [ "$recipe_version" != "$cmake_version" ]; then
            echo "::error::recipe/recipe.yaml version ${recipe_version} does not match the CMakeLists.txt version ${cmake_version}."
            exit 1
          fi

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: package
          cache: true

      - name: Build sdist
        run: pixi run -e package sdist

      - name: Build and test conda package
        run: pixi run -e package conda-build

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: the PyPI project must list this repository, workflow (release.yml) and
    # environment as a trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/goddard/
    permissions:
      id-token: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Goddard ${GITHUB_REF_NAME#v}" \
            --generate-notes
