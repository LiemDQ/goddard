name: CI

on:
  workflow_dispatch:
  
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: test
          cache: true

      - name: Configure
        run: pixi run configure

      - name: Compile
        run: pixi run compile

      - name: Run C++ tests
        run: pixi run ctest --output-on-failure

  python-tests:
    name: Python build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: test
          cache: true

      - name: Build & install Python package
        run: pixi run -e test pip-install

      - name: Run Python tests
        run: pixi run -e test test-python

  static-analysis:
    name: Static analysis (changed lines)
    # Legacy findings do not block: only lines changed by the pull request are checked.
    # Run `pixi run lint` locally for a full report.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: default
          cache: true

      - name: Configure
        run: pixi run configure

      - name: clang-tidy and cppcheck
        run: pixi run lint-changed origin/${{ github.base_ref }}
