[workspace]
authors = ["Liem Dam-Quang <dq@liem.ca>"]
channels = ["conda-forge"]
name = "goddard"
platforms = ["linux-64", "win-64", "osx-64"]
version = "0.1.0"

# Build caches live in the project so sandboxed and worktree builds can write to them, and build
# parallelism is capped: the default ninja -j (one job per core) runs out of memory on 15 GB machines.
[activation.env]
CCACHE_DIR = "$PIXI_PROJECT_ROOT/.cache/ccache"
CPM_SOURCE_CACHE = "$PIXI_PROJECT_ROOT/.cache/cpm"
CMAKE_BUILD_PARALLEL_LEVEL = "6"

[tasks]
compile = "cmake --build build"
ctest = "ctest --test-dir build"
# Skips the tests labelled "slow" (condensed-phase suites)
ctest-fast = "ctest --test-dir build -LE slow"
clean = "rm -rf build"
# Refuses to run in a worktree: its .pixi is shared with the main checkout, so installing there would
# point the shared environment's editable goddard package at the worktree.
pip-install = "bash scripts/pip_install.sh"
# The Python tests import the installed package, so they reinstall it first: a stale `_core` would
# otherwise be tested silently.
[tasks.test-python]
cmd = "pytest python/tests/"
depends-on = ["pip-install"]

# Skips the tests marked "slow" (condensed-phase CEA comparisons)
[tasks.test-python-fast]
cmd = "pytest python/tests/ -m 'not slow'"
depends-on = ["pip-install"]

[tasks.setup-worktree]
args = [{arg = "name"}, {arg = "base", default = "HEAD"}]
cmd = "bash scripts/setup_worktree.sh {{ name }} {{ base }}"

# MoC convergence sweep. Needs -Dgoddard_BUILD_TOOLS=ON at configure time. The library is
# built with ASan, so the preload and options below are mandatory for any binary linked
# against it; folding them in here keeps callers from having to know that.
[tasks.moc-sweep]
cmd = "./build/tools/moc_sweep"
env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libasan.so.8", ASAN_OPTIONS = "detect_odr_violation=0:detect_leaks=0" }
depends-on = ["compile"]


[tasks.configure]
args = [{arg="build_type", default = "Release"}]
cmd="mkdir -p build && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE={{ build_type }}"

# Quick prototyping build: no warnings-as-errors, no static analysis
[tasks.configure-quick]
args = [{arg="build_type", default = "Debug"}]
cmd="mkdir -p build && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE={{ build_type }} -Dgoddard_WARNINGS_AS_ERRORS=OFF -Dgoddard_ENABLE_CLANG_TIDY=OFF -Dgoddard_ENABLE_CPPCHECK=OFF"

# Configure without sanitizers (needed for Python bindings -- ASan cannot
# load as an indirect dependency of a Python extension module)
[tasks.configure-python]
args = [{arg="build_type", default = "Release"}]
cmd="mkdir -p build && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE={{ build_type }} -Dgoddard_ENABLE_SANITIZER_ADDRESS=OFF -Dgoddard_ENABLE_SANITIZER_UNDEFINED=OFF"

# Static analysis (clang-tidy + cppcheck). Needs a configured build/ directory.
# `lint` reports findings across all sources; `lint-changed` fails on findings in code changed
# relative to a git ref, which is what CI runs on pull requests.
[tasks.lint]
cmd = "bash scripts/static_analysis.sh"

[tasks.lint-changed]
args = [{arg = "base", default = "origin/main"}]
cmd = "bash scripts/static_analysis.sh --changed {{ base }}"

[tasks.parse-cea]
cmd="bash scripts/cea_to_json.sh --pretty"

[dependencies]
# cantera = "3.2.*"
libcantera-devel = "3.2.*"
cmake = ">=3.25"
# clang-tidy needs the Clang resource headers (stddef.h, intrinsics), which clang-tools does not ship.
clang-tools = "22.*"
clang-22 = "*"
cppcheck = "*"
ninja = ">=1.11"
scons = "*"
yaml = "*"
pkg-config = "*"
nlohmann_json = "*"
cxx-compiler = "*"
nanobind = "*"
ccache = { channel = "conda-forge" }
gtest = ">=1.15"
eigen = ">=5.0"
python = ">3.11"
pip = "*"
scikit-build-core = ">=0.10"
numpy = "*"
pytest = "*"

[feature.examples.dependencies]
ipykernel = "*"
jupyter = "*"
matplotlib = "*"
loguru = "*"
pandas = "*"
scipy = "*"

[feature.test.dependencies]
fortran-compiler = "*"
cantera = "3.2.*"

[feature.test.pypi-dependencies]
cea = ">=3.3.1"

[feature.test.tasks]
test-cea = "pytest python/tests/test_cea_comparison.py -v"

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
libclang = "*"  # libclang runtime, used by pybind11_mkdoc

[feature.docs.pypi-dependencies]
mkdocstrings = { version = "*", extras = ["python"] }
mkdocs-jupyter = "*"
mike = "*"
pybind11-mkdoc = "*"

# pybind11_mkdoc otherwise picks up a system libclang whose ABI does not match its Python bindings,
# and then silently writes no docstrings.
[feature.docs.activation.env]
LIBCLANG_PATH = "$CONDA_PREFIX/lib/libclang.so.13"

# The docs use their own build directory, pinned to the docs environment's Python (which has
# pybind11_mkdoc), so they neither reconfigure the development build/ nor inherit its interpreter.
# They only need the Python module, so strict warnings and static analysis stay off.
[feature.docs.tasks.docs-configure]
cmd = "mkdir -p build-docs && cmake -B build-docs -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python -Dgoddard_BUILD_DOCSTRINGS=ON -Dgoddard_ENABLE_SANITIZER_ADDRESS=OFF -Dgoddard_ENABLE_SANITIZER_UNDEFINED=OFF -Dgoddard_WARNINGS_AS_ERRORS=OFF -Dgoddard_ENABLE_CLANG_TIDY=OFF -Dgoddard_ENABLE_CPPCHECK=OFF"

# goddard_docstrings.h is shared by every build: a default-env build without pybind11_mkdoc writes the
# stub, which the docs build would otherwise treat as up to date. Removing it forces regeneration.
[feature.docs.tasks.docs-compile]
cmd = "rm -f python/src/goddard_docstrings.h && cmake --build build-docs"
depends-on = ["docs-configure"]

[feature.docs.tasks.docs-stubs]
cmd = "PYTHONPATH=python LD_LIBRARY_PATH=build-docs/src python -m nanobind.stubgen -m goddard._core -o python/goddard/_core.pyi"
depends-on = ["docs-compile"]

[feature.docs.tasks.docs-prepare]
cmd = "python scripts/copy_notebooks_to_docs.py"
depends-on = ["docs-stubs"]

# Note: --strict is omitted because griffe emits warnings for untyped
# parameters in convenience.py. Re-enable once type annotations are added.
[feature.docs.tasks.docs-build]
cmd = "mkdocs build"
depends-on = ["docs-prepare"]

[feature.docs.tasks.docs-serve]
cmd = "mkdocs serve"
depends-on = ["docs-prepare"]

[feature.docs.tasks.docs]
depends-on = ["docs-build"]

[feature.docs.tasks.docs-deploy]
args = [{arg="version", default = "0.1"}]
cmd = "mike deploy --push --update-aliases {{ version }} latest"
depends-on = ["docs-build"]

[environments]
default = {solve-group = "default"}
examples = {features = ["examples"], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
docs = {features = ["docs", "examples"], solve-group = "default"}